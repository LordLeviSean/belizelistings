[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Notification queue delivery — configure in Netlify UI → Site configuration → Functions → Scheduled functions,
# or use an external cron (e.g. cron-job.org) hitting:
#   GET https://<site>/api/cron/process-notifications
# Header: Authorization: Bearer <CRON_SECRET>
# Recommended interval: every 2–5 minutes.
