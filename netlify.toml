[build]
  command = "npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Scheduled notification processor — netlify/functions/process-notifications-cron.mjs
# Requires CRON_SECRET in production env (functions + runtime scope).
# Manual verify: GET /api/cron/process-notifications with Authorization: Bearer <CRON_SECRET>
